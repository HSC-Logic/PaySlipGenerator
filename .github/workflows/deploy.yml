name: Deploy Sliply Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          script: |
            echo "SSH connection successful"
            whoami
            hostname

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          script: |
            mkdir -p /var/www/slipy
            rm -rf /var/www/slipy/*

      - name: Upload build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_DEPLOY_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          port: 10030
          source: "dist/*"
          target: "/var/www/slipy"
          strip_components: 1
